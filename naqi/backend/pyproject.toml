[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naqi-backend"
version = "0.1.0"
description = "Lightweight FastAPI job orchestration backend for NAQI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
packages = ["naqi_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
